name: Create Module Files For GitHub Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Test and validate
        run: |
          npm test
          npm run check
          npm run test:package
      - name: Build release manifest and module.zip
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 tools/package.py --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
      - name: Attach module files to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/module.json dist/module.zip --repo "$GITHUB_REPOSITORY" --clobber
